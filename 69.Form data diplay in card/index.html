<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="form-container">
      <form id="registrationForm">
        <h2>Registration Form</h2>

        <label for="image-url">Image:</label>
        <input type="url" id="image" name="image-url" />
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" />

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" />

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="shiva@gmail.com" />

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" />

        <button type="submit" id="btn-submit">Submit</button>
      </form>
    </div>
    <div class="card-data d-flex" id="card-data">
      <div class="card" id="card" style="width: 16rem">
        <img
          src="https://images.unsplash.com/photo-1531496730074-83b638c0a7ac?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTV8fHN0dWRlbnRzfGVufDB8fDB8fHww"
          class="card-img-top"
          alt="..."
        />
        <div class="card-body">
          <h5 class="card-title" style="font-weight: 600">Form data</h5>
          <p class="card-text">Name:Bipin</p>
          <p class="card-text">Address:Galyang</p>
          <p class="card-text">Phone:9849118922</p>
          <p class="card-text">Email:hello@gmail.com</p>
          <p class="card-text">Password:********</p>
          <div class="btn btn-container">
            <a href="#" class="btn btn-primary">Edit</a>
            <a href="#" class="btn btn-danger">Delete</a>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
